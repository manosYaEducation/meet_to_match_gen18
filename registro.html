<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - Meet to Match POC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css?v=20260707-1" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#151515">
</head>
<body>
  <div id="app-navbar"></div>

  <header class="hero">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <p class="text-uppercase small text-warning fw-bold mb-2">Evento presencial</p>
          <h1 class="display-5 fw-bold">Registra tu perfil para conectar en el evento</h1>
          <p class="lead mb-0">Completa tus datos, explora participantes y solicita reuniones privadas.</p>
        </div>
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">Crear perfil</h2>
              <form id="registro-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Nombre *</label>
                    <input class="form-control" name="nombre" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input class="form-control" name="apellido">
                  </div>
                  <div class="col-12">
                    <label class="form-label">Correo *</label>
                    <input type="email" class="form-control" name="correo" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Empresa / institución</label>
                    <input class="form-control" name="empresa">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Cargo / rol</label>
                    <input class="form-control" name="cargo">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="tipo_usuario">Categoría de participante *</label>
                    <select class="form-select" id="tipo_usuario" name="tipo_usuario" required>
                      <option value="" selected disabled>Selecciona una categoría</option>
                      <option value="Organizador">Organizador</option>
                      <option value="Expositor">Expositor</option>
                      <option value="Asistente">Asistente</option>
                    </select>
                    <div class="form-text">Elige el rol que tendrás dentro del evento.</div>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Intereses</label>
                    <textarea class="form-control" name="intereses" rows="2" placeholder="Tecnología, negocios, cultura..."></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Qué buscas en el evento</label>
                    <textarea class="form-control" name="busca" rows="2"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Descripción breve</label>
                    <textarea class="form-control" name="descripcion" rows="3"></textarea>
                  </div>
                </div>
                <div id="registro-mensaje" class="mt-3"></div>
                <button class="btn btn-primary w-100 mt-3" type="submit">Guardar y ver participantes</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="app-footer"></div>
  <div id="qr-modals-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="js/app.js?v=20260721-1"></script>
  <script src="js/registro.js?v=20260720-1"></script>
</body>
</html>
