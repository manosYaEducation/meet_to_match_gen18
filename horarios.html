<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloques horarios - Meet to Match Gen18</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css?v=20260721-1" rel="stylesheet">
</head>
<body>
  <div id="app-navbar"></div>

  <main class="container py-4">
    <div class="mb-4">
      <h1 class="h2 mb-1">Bloques horarios</h1>
      <p class="small-muted mb-0">Crea la agenda del evento y revisa los bloques disponibles para reuniones.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Crear bloques</h2>
            <p class="small-muted">Se generan intervalos consecutivos dentro del rango indicado.</p>
            <form id="horarios-form">
              <label class="form-label" for="fecha">Fecha</label>
              <input class="form-control mb-3" type="date" id="fecha" name="fecha" value="2026-07-08" required>

              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label" for="hora_inicio">Desde</label>
                  <input class="form-control" type="time" id="hora_inicio" name="hora_inicio" value="09:00" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="hora_fin">Hasta</label>
                  <input class="form-control" type="time" id="hora_fin" name="hora_fin" value="22:30" required>
                </div>
              </div>

              <label class="form-label mt-3" for="duracion_minutos">Duración</label>
              <select class="form-select mb-3" id="duracion_minutos" name="duracion_minutos">
                <option value="15">15 minutos</option>
                <option value="30" selected>30 minutos</option>
                <option value="45">45 minutos</option>
                <option value="60">60 minutos</option>
              </select>

              <button class="btn btn-primary w-100" type="submit">Crear bloques</button>
              <div id="horarios-mensaje" class="mt-3"></div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Agenda configurada</h2>
          <span class="badge text-bg-dark" id="horarios-total">0 bloques</span>
        </div>
        <div id="horarios-lista" class="row g-2"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <div id="qr-modals-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="js/app.js?v=20260721-1"></script>
  <script src="js/horarios.js?v=20260721-1"></script>
</body>
</html>
